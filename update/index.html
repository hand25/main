<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 빌딩 시스템</title>
    <style>
        :root {
            --primary: #2ea44f;
            --primary-hover: #2c974b;
            --danger: #d73a49;
            --danger-hover: #cb2431;
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-main: #24292e;
            --text-sub: #586069;
            --border-color: #e1e4e8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { text-align: center; margin-bottom: 10px; }
        .notice {
            background-color: #f1f8ff; border: 1px solid #c8e1ff; color: #005cc5;
            padding: 12px 16px; border-radius: 6px; font-size: 0.95em; margin-bottom: 24px;
        }
        .teams-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px;
        }
        .team-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .team-title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: #0366d6; border-bottom: 2px solid #eaecef; padding-bottom: 6px; }
        .member-list { list-style: none; padding: 0; margin: 0 0 16px 0; min-height: 80px; max-height: 150px; overflow-y: auto; }
        .member-item {
            background-color: #fafbfc; border: 1px solid #e1e4e8; padding: 6px 10px;
            border-radius: 4px; margin-bottom: 6px; font-size: 0.9em;
        }
        .member-item span.empty { color: var(--text-sub); font-style: italic; }
        .btn-group { display: flex; gap: 6px; }
        button {
            border: none; padding: 8px 10px; border-radius: 6px; font-weight: 500;
            cursor: pointer; color: white; flex: 1; font-size: 0.9em;
        }
        .btn-join { background-color: var(--primary); }
        .btn-join:hover { background-color: var(--primary-hover); }
        .btn-cancel { background-color: var(--danger); }
        .btn-cancel:hover { background-color: var(--danger-hover); }
        .status-box { text-align: center; font-size: 0.9em; color: var(--text-sub); margin-top: 20px; }
    </style>
</head>
<body>

    <h1>👥 팀 빌딩 시스템</h1>
    
    <div class="notice">
        ℹ️ <strong>사용 방법</strong><br>
        1. 원하는 팀의 <strong>[참가]</strong> 또는 <strong>[취소]</strong> 버튼을 누르세요.<br>
        2. 이름을 입력하면 로그인이 필요 없이 곧바로 팀에 반영되며, 다른 사람들의 화면에도 실시간으로 공유됩니다.
    </div>

    <div class="teams-container" id="teams-container"></div>
    <div class="status-box" id="loading-status">데이터를 불러오는 중...</div>

    <script>
        // 🚨 본인의 구글 Apps Script [웹 앱 URL]을 여기에 넣으세요!
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw-i5jImTlgqD31dQKNFDlnmUvn2_GMCdyigvIBhklH9YP5BRefS8PMkMR7uwkrbrbS/exec";

        const teamNames = ["1팀", "2팀", "3팀", "4팀"];

        function renderTeamsStructure() {
            const container = document.getElementById('teams-container');
            container.innerHTML = '';

            teamNames.forEach((team, index) => {
                const teamId = `team-${index + 1}`;
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <div class="team-title">${team}</div>
                    <ul class="member-list" id="list-${teamId}">
                        <li class="member-item"><span class="empty">불러오는 중...</span></li>
                    </ul>
                    <div class="btn-group">
                        <button class="btn-join" onclick="handleAction('${team}', 'join')">참가</button>
                        <button class="btn-cancel" onclick="handleAction('${team}', 'cancel')">취소</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function handleAction(teamName, actionType) {
            const actionText = actionType === 'join' ? '참가할' : '취소할';
            const name = prompt(`${teamName}에 ${actionText} 이름을 입력하세요:`);
            if (!name || !name.trim()) return;

            document.getElementById('loading-status').innerText = '처리 중입니다...';

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 구글 앱스크립트 CORS 우회
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionType, team: teamName, name: name.trim() })
                });

                // 반영 시간 고려해 1초 뒤 새로고침
                setTimeout(() => {
                    loadTeamMembers();
                }, 1000);
            } catch (error) {
                console.error(error);
                alert('요청 중 오류가 발생했습니다.');
                loadTeamMembers();
            }
        }

        async function loadTeamMembers() {
            const statusBox = document.getElementById('loading-status');
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();

                const teamMembersData = { "1팀": [], "2팀": [], "3팀": [], "4팀": [] };

                data.forEach(row => {
                    if (teamMembersData[row.team]) {
                        teamMembersData[row.team].push(row.name);
                    }
                });

                teamNames.forEach((team, index) => {
                    const teamId = `team-${index + 1}`;
                    const listEl = document.getElementById(`list-${teamId}`);
                    listEl.innerHTML = '';

                    const members = teamMembersData[team];
                    if (members.length === 0) {
                        listEl.innerHTML = `<li class="member-item"><span class="empty">아직 팀원이 없습니다.</span></li>`;
                    } else {
                        members.forEach(memberName => {
                            const li = document.createElement('div');
                            li.className = 'member-item';
                            li.innerHTML = `<strong>${escapeHtml(memberName)}</strong>`;
                            listEl.appendChild(li);
                        });
                    }
                });

                statusBox.innerText = '✅ 최신 팀 현황을 불러왔습니다.';
            } catch (error) {
                console.error(error);
                statusBox.innerText = '❌ 데이터를 불러오지 못했습니다.';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        renderTeamsStructure();
        loadTeamMembers();
    </script>
</body>
</html>
